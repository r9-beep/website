<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MNC Simulator</title>
<meta name="description" content="Build a multinational on a to-scale world map: claim oil, ore and lithium, ship it by sea and air, and climb from timber to quantum computers.">
<meta name="theme-color" content="#08111b">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family: Inter; font-weight: 400; font-display: swap; src: url(../assets/fonts/inter-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 500; font-display: swap; src: url(../assets/fonts/inter-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 600; font-display: swap; src: url(../assets/fonts/inter-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: Plex; font-weight: 400; font-display: swap; src: url(../assets/fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: Plex; font-weight: 500; font-display: swap; src: url(../assets/fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2'); }
:root {
  --bg: #08111b; --panel: rgba(12, 22, 34, 0.94); --panel-2: #111f30; --line: #1f3248; --line-2: #2a4260;
  --text: #e4ecf5; --muted: #8aa0b8; --dim: #5d7590; --accent: #ff4d6d; --good: #3ddc97; --warn: #ffb547; --bad: #ff5f5f; --event: #7cc4ff;
  --mono: Plex, ui-monospace, SFMono-Regular, Menlo, monospace; --sans: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --top: 54px; --rail: 60px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
#map { position: fixed; inset: 0; display: block; touch-action: none; cursor: grab; }
#map.dragging { cursor: grabbing; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Top bar */
#top { position: fixed; top: 0; left: 0; right: 0; height: var(--top); display: flex; align-items: center; gap: 18px; padding: 0 14px; background: linear-gradient(#0b1724f2, #0b1724d9); border-bottom: 1px solid var(--line); z-index: 20; backdrop-filter: blur(8px); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .logo { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 600; font-size: 11px; letter-spacing: .04em; background: var(--accent); color: #0a0f16; flex: none; }
.brand b { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.brand small { display: block; color: var(--muted); font-size: 11px; }
.stats { display: flex; gap: 18px; margin-left: auto; }
.stat { display: flex; flex-direction: column; line-height: 1.15; }
.stat label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
.stat span { font-family: var(--mono); font-size: 14px; white-space: nowrap; }
.stat .pos { color: var(--good); } .stat .neg { color: var(--bad); }
.speed { display: flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.speed button { background: none; border: 0; padding: 6px 9px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.speed button + button { border-left: 1px solid var(--line); }
.speed button.on { background: var(--accent); color: #0a0f16; font-weight: 600; }
.iconbtn { background: none; border: 1px solid var(--line-2); border-radius: 8px; width: 34px; height: 32px; color: var(--muted); font-size: 16px; }
.iconbtn:hover { color: var(--text); border-color: var(--muted); }

/* Rail */
#rail { position: fixed; top: var(--top); left: 0; bottom: 0; width: var(--rail); display: flex; flex-direction: column; gap: 4px; padding: 10px 6px; background: #0a1520e6; border-right: 1px solid var(--line); z-index: 15; }
#rail button { position: relative; background: none; border: 0; border-radius: 10px; padding: 8px 0 6px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; }
#rail button .i { font-size: 18px; line-height: 1; filter: grayscale(.4); }
#rail button:hover { background: #ffffff0d; color: var(--text); }
#rail button.on { background: #ffffff14; color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
#rail button.on .i { filter: none; }
#rail .dot { position: absolute; top: 5px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }

/* Panels */
.panel { position: fixed; top: calc(var(--top) + 10px); bottom: 10px; width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; z-index: 14; display: flex; flex-direction: column; box-shadow: 0 20px 50px #0008; backdrop-filter: blur(10px); }
#left { left: calc(var(--rail) + 10px); }
#right { right: 10px; width: 380px; }
.panel[hidden] { display: none; }
.ph { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.ph h2 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; min-width: 0; }
.ph h2 small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 2px; }
.ph .x { background: none; border: 0; color: var(--muted); font-size: 20px; line-height: 1; padding: 4px; }
.pb { overflow-y: auto; padding: 12px 16px 18px; flex: 1; overscroll-behavior: contain; }
.pb::-webkit-scrollbar { width: 8px; } .pb::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--dim); margin: 18px 0 8px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
h3:first-child { margin-top: 2px; }
h3 .r { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
.muted { color: var(--muted); } .dim { color: var(--dim); } .good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.card.click { cursor: pointer; } .card.click:hover { border-color: var(--line-2); background: #142538; }
.row { display: flex; align-items: center; gap: 8px; }
.row .grow { flex: 1; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #ffffff0f; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.b { color: var(--good); border-color: #3ddc9744; background: #3ddc9712; }
.chip.w { color: var(--warn); border-color: #ffb54744; background: #ffb54712; }
.btn { background: #ffffff0d; border: 1px solid var(--line-2); border-radius: 8px; padding: 5px 10px; font-size: 12px; white-space: nowrap; color: var(--text); }
.btn:hover:not(:disabled) { background: #ffffff1a; border-color: var(--muted); }
.btn.p { background: var(--accent); border-color: transparent; color: #0a0f16; font-weight: 600; }
.btn.p:hover:not(:disabled) { filter: brightness(1.1); background: var(--accent); }
.btn.sm { padding: 3px 7px; font-size: 11px; }
.btn.ghost { background: none; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.block { width: 100%; padding: 9px; }
.ic { font-size: 16px; width: 22px; text-align: center; flex: none; }
.bar { height: 5px; border-radius: 3px; background: #ffffff12; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar.g > i { background: var(--good); } .bar.w > i { background: var(--warn); }
table { width: 100%; border-collapse: collapse; }
td, th { padding: 5px 4px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); font-weight: 600; }
td.n, th.n { text-align: right; font-family: var(--mono); }
.slotrow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--line); font-size: 12px; }
.slotrow:first-of-type { border-top: 0; }
.pip { width: 10px; height: 10px; border-radius: 3px; flex: none; background: var(--c, transparent); border: 1.5px solid var(--c, var(--dim)); }
.pip.free { background: none; }
.toggle { appearance: none; width: 28px; height: 16px; border-radius: 99px; background: #ffffff1a; position: relative; cursor: pointer; vertical-align: middle; margin: 0; flex: none; }
.toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
.toggle:checked { background: var(--good); } .toggle:checked::after { transform: translateX(12px); background: #0a0f16; }
input.keep { width: 58px; background: #0008; border: 1px solid var(--line-2); border-radius: 6px; padding: 2px 5px; font-family: var(--mono); font-size: 11px; text-align: right; }
.tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
.tabs button { background: none; border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; font-size: 12px; color: var(--muted); }
.tabs button.on { border-color: var(--accent); color: var(--text); background: #ff4d6d1a; }
.lead { display: grid; grid-template-columns: 20px 1fr auto; gap: 4px 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.lead .sw { width: 12px; height: 12px; border-radius: 3px; }
.goal { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.goal .ck { width: 20px; height: 20px; flex: none; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; font-size: 11px; }
.goal.done .ck { background: var(--good); border-color: var(--good); color: #0a0f16; }
.goal.done b { color: var(--muted); }
.news { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
.news .d { font-family: var(--mono); font-size: 10px; color: var(--dim); }
.recipe { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 11px; color: var(--muted); }
.recipe span { background: #ffffff0a; border-radius: 5px; padding: 1px 5px; white-space: nowrap; }
.spark { width: 100%; height: 70px; display: block; }

/* Toasts */
#toasts { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column-reverse; gap: 6px; z-index: 40; pointer-events: none; width: min(560px, calc(100vw - 32px)); }
.toast { pointer-events: auto; background: #0e1b2af5; border: 1px solid var(--line-2); border-left: 3px solid var(--muted); border-radius: 10px; padding: 9px 12px; font-size: 13px; box-shadow: 0 10px 30px #0009; animation: tin .25s ease-out; display: flex; gap: 10px; align-items: center; }
.toast.good { border-left-color: var(--good); } .toast.bad { border-left-color: var(--bad); } .toast.warn { border-left-color: var(--warn); } .toast.event { border-left-color: var(--event); } .toast.goal { border-left-color: #ffd34d; }
.toast .grow { flex: 1; }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }
#tip { position: fixed; pointer-events: none; z-index: 30; background: #0b1724f2; border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 10px; font-size: 12px; max-width: 260px; display: none; }
#scale { position: fixed; bottom: 14px; right: 14px; z-index: 5; font: 11px var(--mono); color: var(--muted); text-align: right; pointer-events: none; }
#scale i { display: block; height: 6px; border: 1.5px solid var(--muted); border-top: 0; margin-top: 2px; margin-left: auto; }
#fxbar { position: fixed; top: calc(var(--top) + 10px); left: 50%; transform: translateX(-50%); z-index: 12; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 50vw; pointer-events: none; }
#fxbar .chip { background: #0b1724e6; pointer-events: auto; }

/* Modal */
#modal { position: fixed; inset: 0; background: #03080ecc; z-index: 50; display: grid; place-items: center; padding: 16px; backdrop-filter: blur(3px); }
#modal[hidden] { display: none; }
.mc { width: min(640px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: #0d1a28; border: 1px solid var(--line-2); border-radius: 16px; padding: 22px 24px; box-shadow: 0 30px 80px #000c; }
.mc h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
.mc .sub { color: var(--muted); margin: 0 0 16px; }
.mc label.f { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 14px 0 6px; font-weight: 600; }
.mc input[type=text], .mc input[type=number], .mc select { width: 100%; background: #0007; border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; }
.mc .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
.swatches { display: flex; gap: 8px; }
.swatches button { width: 30px; height: 30px; border-radius: 8px; border: 2px solid transparent; }
.swatches button.on { border-color: #fff; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.opt { text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; color: var(--text); }
.opt:hover { border-color: var(--line-2); }
.opt.on { border-color: var(--accent); background: #ff4d6d14; }
.opt small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 10px; max-height: 190px; overflow-y: auto; padding: 8px; background: #0005; border: 1px solid var(--line); border-radius: 8px; }
.pick label { display: flex; gap: 6px; align-items: center; font-size: 12px; cursor: pointer; white-space: nowrap; overflow: hidden; }
.pick label .q { margin-left: auto; color: var(--dim); font-family: var(--mono); font-size: 11px; }
.plant { display: grid; grid-template-columns: 26px 1fr auto; gap: 2px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.plant.locked { opacity: .45; }
.plant .ic { grid-row: span 2; font-size: 20px; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin: 10px 0 6px; }
kbd { font-family: var(--mono); font-size: 11px; background: #ffffff14; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
.how li { margin-bottom: 6px; color: var(--muted); } .how b { color: var(--text); }

@media (max-width: 900px) {
  :root { --top: 50px; --rail: 0px; }
  .stat.hide-sm, .brand small { display: none; }
  .stats { gap: 12px; }
  #rail { top: auto; bottom: 0; left: 0; right: 0; width: auto; height: 58px; flex-direction: row; justify-content: space-around; padding: 4px; border-right: 0; border-top: 1px solid var(--line); }
  #rail button { flex: 1; padding: 6px 0 4px; }
  #rail button.on { box-shadow: inset 0 3px 0 var(--accent); }
  .panel, #right { left: 8px !important; right: 8px; width: auto; top: auto; bottom: 66px; height: 58vh; }
  #toasts { bottom: 74px; }
  #scale { bottom: 72px; }
  #fxbar { max-width: 90vw; }
}
@media (max-width: 560px) {
  #top { gap: 8px; padding: 0 8px; }
  .brand > div:last-child { display: none; }
  .stats { margin-left: 0; flex: 1; }
  .stat.hide-xs { display: none; }
  .speed button { padding: 6px 7px; font-size: 11px; }
  .iconbtn { width: 32px; flex: none; }
  #toasts { top: calc(var(--top) + 8px); bottom: auto; flex-direction: column; }
  .toast { font-size: 12px; padding: 7px 10px; }
  .toast:nth-child(n+3) { display: none; }
}
</style>
</head>
<body>
<canvas id="map" aria-label="World map"></canvas>

<header id="top">
  <div class="brand"><div class="logo" id="logo">MNC</div><div><b id="coName">MNC Simulator</b><small id="coSub">Multinational Company Simulator</small></div></div>
  <div class="stats">
    <div class="stat hide-xs"><label>Date</label><span id="hDate">—</span></div>
    <div class="stat"><label>Cash</label><span id="hCash">—</span></div>
    <div class="stat hide-sm"><label>Net worth</label><span id="hWorth">—</span></div>
    <div class="stat hide-sm"><label>Profit 30d</label><span id="hProfit">—</span></div>
    <div class="stat hide-sm"><label>Rank</label><span id="hRank">—</span></div>
  </div>
  <div class="speed" id="speed" role="group" aria-label="Game speed"></div>
  <button class="iconbtn" id="menuBtn" aria-label="Menu" title="Menu">☰</button>
</header>

<nav id="rail" aria-label="Panels"></nav>
<aside id="left" class="panel" hidden></aside>
<aside id="right" class="panel" hidden></aside>
<div id="fxbar"></div>
<div id="toasts" aria-live="polite"></div>
<div id="tip"></div>
<div id="scale"></div>
<div id="modal" hidden><div class="mc" id="mc"></div></div>

<script type="module" src="game.js"></script>
</body>
</html>
