<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BAC share card</title>
<link href="../assets/css/fonts.css" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#06080F;color:#F0EDE6;font-family:Inter,sans-serif}
  .bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 80% at 72% 55%,#1c2650 0%,#0b1022 55%,#06080f 100%)}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse 80% 80% at 60% 50%,#000,transparent)}
  .glow{position:absolute;right:-120px;top:120px;width:700px;height:420px;background:radial-gradient(ellipse at center,rgba(200,16,46,.22),transparent 65%)}
  #c{position:absolute;left:330px;top:40px;width:900px;height:560px}
  .txt{position:absolute;left:64px;top:64px;bottom:64px;width:520px;display:flex;flex-direction:column}
  .eyebrow{display:flex;align-items:center;gap:14px;font-size:15px;letter-spacing:.26em;text-transform:uppercase;color:#EF3B55;font-weight:500}
  .eyebrow svg{width:44px;height:44px}
  h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:92px;line-height:.95;margin:34px 0 18px;font-variant-numeric:lining-nums}
  h1 em{color:#C9A84C}
  p{font-size:23px;color:#C5CAD3;line-height:1.45;margin:0;max-width:440px}
  .specs{margin-top:auto;display:flex;gap:44px}
  .specs b{display:block;font-family:'Cormorant Garamond',serif;font-size:44px;font-weight:600;line-height:1;font-variant-numeric:lining-nums}
  .specs small{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#9AA0AC}
  .bar{position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,#C8102E 0 70%,#F0EDE6 70% 72%,#C9A84C 72%)}
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div><div class="glow"></div>
<div id="c"></div>
<div class="txt">
  <div class="eyebrow"><svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="20" fill="none" stroke="#C8102E" stroke-width="1.5"/><circle cx="21" cy="21" r="13" fill="none" stroke="#fff"/><circle cx="21" cy="21" r="6" fill="#C8102E"/><path d="M1 21 L15 18 L15 24 Z" fill="#C8102E" opacity=".6"/><path d="M41 21 L27 18 L27 24 Z" fill="#C8102E" opacity=".6"/></svg>British Aircraft Corporation</div>
  <h1 id="name"></h1>
  <p id="tag"></p>
  <div class="specs" id="specs"></div>
</div>
<div class="bar"></div>
<script type="module">
import * as THREE from '../assets/js/vendor/three.js';
import { FLEET_BY_ID, fmt } from '../assets/js/data/fleet.js';
import { buildAircraft, loadLiveryFonts } from '../assets/js/lib/aircraft.js';
import { createStage, studioLighting } from '../assets/js/lib/stage.js';
const q = new URLSearchParams(location.search);
const spec = FLEET_BY_ID[q.get('id') || '4-44ulr'];
const [first, ...rest] = spec.name.split(' ');
document.getElementById('name').innerHTML = `${first} <em>${rest.join(' ')}</em>`;
document.getElementById('tag').textContent = spec.tagline;
document.getElementById('specs').innerHTML = [[fmt(spec.specs.seats), 'Max seats'], [fmt(spec.specs.rangeKm) + ' km', 'Range'], [spec.specs.engines, 'Engines']].map(([v, k]) => `<div><b>${v}</b><small>${k}</small></div>`).join('');
await loadLiveryFonts(4000);
const stage = createStage(document.getElementById('c'), { alpha: true, preserveDrawingBuffer: true, maxDpr: 2, fov: 26 });
studioLighting(stage);
const ac = buildAircraft(spec, { detail: 1 });
ac.lightLevel = 0.5; ac.update(0.5, 0.016);
stage.scene.add(ac.group);
const box = new THREE.Box3().setFromObject(ac.group), c = box.getCenter(new THREE.Vector3());
const L = spec.geo.length;
stage.camera.position.set(c.x + L * 0.95, c.y + L * 0.36, c.z + L * 1.05);
stage.camera.lookAt(c.x - L * 0.05, c.y, c.z);
stage.renderOnce();
window.__ready = true;
</script>
</body>
</html>
